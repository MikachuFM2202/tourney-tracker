/* Layout: sticky frosted top bar, full-width hero (headline, stats, volleyball), then one column of grey rounded tiles: live strip, search, standings, schedule by 20-minute slot, knockout bracket, teams, footer. Admin adds score inputs and a floating save bar. */
:root {
  --bg: #ffffff;
  --surface: #f4f4f4;
  --surface-2: #ebebeb;
  --card: #ffffff;
  --ink: #000000;
  --muted: #5f5f5f;
  --line: #e2e2e2;
  --accent: #1a6dff;
  --accent-on: #ffffff;
  --accent-soft: #e7efff;
  --live: #e5252a;
  --gold: #d4a63c;
  --dark: #0b0b0b;
  --dark-on: #ffffff;
  --c1: #1a6dff;
  --c1-soft: #e7efff;
  --c2: #08875b;
  --c2-soft: #e0f4ec;
  --win: #08774f;
  --warn: #9a4a00;
  --warn-soft: #fff2e0;
  --err: #c4251c;
  --hit: #ffe17a;
  --tint-s: 72%;
  --tint-l: 94%;
  --hero: linear-gradient(160deg, #d9edf7 0%, #edf6f2 48%, #f9f0e1 100%);
  --slot-a: rgba(26, 109, 255, .07);
  --slot-b: rgba(212, 166, 60, .13);
  --slot-a-line: rgba(26, 109, 255, .5);
  --slot-b-line: rgba(186, 132, 20, .6);
  --glass: rgba(255, 255, 255, .72);
  --display: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sand: #efdcb0;
  --sky: #dcf0fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --surface: #151515;
    --surface-2: #222222;
    --card: #0c0c0c;
    --ink: #ffffff;
    --muted: #a9a9a9;
    --line: #2b2b2b;
    --accent: #5b95ff;
    --accent-on: #000000;
    --accent-soft: #0f1f3d;
    --live: #ff5357;
    --gold: #e9c46a;
    --dark: #1b1b1b;
    --dark-on: #ffffff;
    --c1: #7aa9ff;
    --c1-soft: #0f1f3d;
    --c2: #44d29e;
    --c2-soft: #0c2a1f;
    --win: #44d29e;
    --warn: #f2a964;
    --warn-soft: #2e2112;
    --err: #ff8a80;
    --hit: #5c4a0e;
    --tint-s: 34%;
    --tint-l: 13%;
    --hero: linear-gradient(160deg, #06141f 0%, #0a1916 48%, #1a1409 100%);
    --slot-a: rgba(91, 149, 255, .12);
    --slot-b: rgba(233, 196, 106, .10);
    --slot-a-line: rgba(91, 149, 255, .55);
    --slot-b-line: rgba(233, 196, 106, .5);
    --glass: rgba(0, 0, 0, .55);

    --sky: #0c1a26;
    color-scheme: dark;
  }
}

  --bg: #000000;

  --gold: #e9c46a;

  --c1: #7aa9ff;
  --c1-soft: #0f1f3d;

  --c2-soft: #0c2a1f;
  --win: #44d29e;
  --warn: #f2a964;
  --warn-soft: #2e2112;
  --err: #ff8a80;
  --hit: #5c4a0e;
  --tint-s: 34%;
  --tint-l: 13%;
  --hero: linear-gradient(160deg, #06141f 0%, #0a1916 48%, #1a1409 100%);
  --slot-a: rgba(91, 149, 255, .12);

  --slot-a-line: rgba(91, 149, 255, .55);

  --sky: #0c1a26;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; padding-bottom: 48px; -webkit-font-smoothing: antialiased; }
body.has-bar { padding-bottom: 170px; }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1200px; margin-inline: auto; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 768px) { .wrap { padding-inline: 32px; } }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(1.8) blur(18px); backdrop-filter: saturate(1.8) blur(18px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1200px; margin-inline: auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 24px; }
@media (min-width: 768px) { .topbar-in { padding-inline: 32px; } }
.mark { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .2em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.mark b { color: var(--accent); font-weight: 800; }
.nav { order: 3; flex: 1 1 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -10px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; white-space: nowrap; padding: 5px 10px; border-radius: 999px; transition: background .2s; }
.nav a:hover, .nav button:hover { background: var(--surface); }
.nav button { font-weight: 700; font-size: 15px; white-space: nowrap; padding: 5px 12px; border-radius: 999px; border: 0; background: var(--accent-soft); color: var(--accent); }
/* phones and tablets: fade the right edge so it is clear the links scroll sideways */
@media (max-width: 899px) { .nav { -webkit-mask-image: linear-gradient(to right, #000 82%, transparent); mask-image: linear-gradient(to right, #000 82%, transparent); padding-right: 48px; } }
@media (min-width: 900px) { .nav { order: 0; flex: 0 1 auto; margin: 0; } }
.tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.logo { display: block; width: 40px; height: 40px; border-radius: 50%; flex: none; }
.logo.sm { width: 32px; height: 32px; }
/* small phones: one row for the bar, so drop the mode badge and tighten the wordmark */
@media (max-width: 440px) { .topbar .mode { display: none; } .mark { font-size: 17px; letter-spacing: .14em; } .topbar .logo { width: 34px; height: 34px; } .tools { gap: 10px; } }
.foot-r { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; }
.offline { background: var(--live); color: #fff; font-size: 13px; font-weight: 600; text-align: center; padding: 6px 16px; }
.offline .pill { border-color: #fff; color: #fff; margin-left: 8px; padding: 3px 12px; font-size: 13px; }
.mode { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 3px 10px; }
.linkbtn { background: transparent; border: 0; padding: 2px 0; font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 4px; }

/* hero */
.hero { position: relative; overflow: hidden; background: var(--hero); }
.hero-in { position: relative; max-width: 1200px; margin-inline: auto; padding: 44px 16px 40px; display: grid; gap: 28px; }
@media (min-width: 768px) { .hero-in { padding: 96px 32px 72px; } }
.hero-copy { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(60px, 16vw, 132px); line-height: .9; letter-spacing: -.045em; }
.hero h1 .sg { font-size: .68em; letter-spacing: -.03em; }
.hero h1 b { font-weight: 700; background: linear-gradient(100deg, var(--accent), #12b5c9); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: clamp(17px, 2.3vw, 22px); font-weight: 500; max-width: 34ch; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 11px 22px; text-decoration: none; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); transition: transform .25s var(--ease), background .2s, color .2s; }
.pill.solid { background: var(--ink); color: var(--bg); }
.pill:hover { transform: translateY(-2px); }
.pill:not(.solid):hover { background: var(--ink); color: var(--bg); }
.pill.sm { padding: 7px 16px; font-size: 14px; }
.stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 760px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 20px; padding: 14px 16px; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; font-weight: 500; color: var(--muted); }
.stamp { position: relative; z-index: 1; font-size: 13px; color: var(--muted); }
/* wide screens: big ball beside the text. Phones and tablets: smaller ball on the same row as the headline. */
.ballwrap { position: absolute; top: 70px; right: 4%; width: min(32vw, 420px); aspect-ratio: 1; animation: bob 6s ease-in-out infinite; pointer-events: none; }
.headline { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; }
.miniball { flex: none; width: clamp(76px, 25vw, 170px); aspect-ratio: 1; animation: bob 6s ease-in-out infinite; }
@media (max-width: 1099px) { .ballwrap { display: none; } }
@media (min-width: 1100px) { .miniball { display: none; } }
@media (max-width: 599px) { .hero h1 { font-size: 14.5vw; } }
/* the spinning image is a cut-out on a transparent background, so the shadow follows its outline */
.ball { position: relative; width: 100%; height: 100%; animation: spin 60s linear infinite; }
.ball img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 24px 30px rgba(0, 40, 90, .35)); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-14px); } }
.intro .hero-copy > *, .intro .stats { animation: up .9s var(--ease) both; }
.intro .hero-copy > :nth-child(2) { animation-delay: .08s; }
.intro .hero-copy > :nth-child(3) { animation-delay: .16s; }
.intro .hero-copy > :nth-child(4) { animation-delay: .24s; }
.intro .stats { animation-delay: .32s; }
@keyframes up { from { opacity: 0; transform: translateY(26px); } }

/* live strip */
.next { background: var(--surface); border-radius: 24px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.next .k { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.next .v { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.next .prog { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.livepill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--live); }
.livepill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.mybox .field { flex: 0 1 16rem; }
.myrec { flex-basis: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.match.mine { outline: 3px solid var(--accent); outline-offset: -3px; }
/* CAT 3.0 mini game: 3D serve practice (assets/serve3d.js) */
.game { display: flex; flex-direction: column; gap: 10px; }
.s3d { position: relative; width: 100%; aspect-ratio: 4 / 5; max-height: 82vh; border-radius: 22px; overflow: hidden; background: linear-gradient(#6fbde8, #fbeedb); color: #0b2233; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
@media (min-width: 768px) { .s3d { aspect-ratio: 16 / 9; } }
.s3d.full { position: fixed; inset: 0; z-index: 60; max-height: none; aspect-ratio: auto; border-radius: 0; }
body.s3d-lock { overflow: hidden; }
.s3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.s3d-load { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 700; }
.s3d-hud { position: absolute; inset: 0; pointer-events: none; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.s3d-top { display: flex; flex-wrap: wrap; gap: 6px; padding-right: 128px; }
.s3d-chip { background: rgba(255, 255, 255, .86); border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0, 40, 90, .12); }
.s3d-chip.tm.low { background: #e8573c; color: #fff; }
.s3d-sub { display: flex; align-items: center; gap: 8px; }
.s3d-left { display: flex; gap: 4px; padding: 6px 9px; background: rgba(255, 255, 255, .6); border-radius: 999px; }
.s3d-left i { width: 10px; height: 10px; border-radius: 50%; background: #e8573c; }
.s3d-left i.gone { background: rgba(11, 34, 51, .2); }
.s3d-chip.wind[hidden] { display: none; }
.s3d-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.s3d-tool { pointer-events: auto; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .86); font-size: 17px; line-height: 1; box-shadow: 0 2px 8px rgba(0, 40, 90, .12); }
.s3d-power { position: absolute; right: 12px; bottom: 14px; width: 16px; height: 40%; border-radius: 10px; background: rgba(255, 255, 255, .55); overflow: hidden; opacity: 0; transition: opacity .15s; }
.s3d-power.on { opacity: 1; }
.s3d-power i { position: absolute; inset: 0; transform-origin: bottom; transform: scaleY(0); background: #3fae6a; }
.s3d-power i.bad { background: #e8573c; }
.s3d-power b { position: absolute; bottom: 100%; right: 0; font-size: 0; }
.s3d-msg { align-self: center; margin-top: auto; margin-bottom: 8px; background: rgba(11, 34, 51, .82); color: #fff; font-weight: 700; border-radius: 999px; padding: 8px 16px; font-size: 15px; text-align: center; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
.s3d-msg.on { opacity: 1; transform: none; }
.s3d-pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.s3d-pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, .45); animation: s3dpop 1s ease-out forwards; white-space: nowrap; }
@keyframes s3dpop { from { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } to { opacity: 0; margin-top: -50px; } }
.s3d-panel { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(11, 34, 51, .35); }
.s3d-panel[hidden] { display: none; }
.s3d-card { background: var(--bg); color: var(--ink); border-radius: 24px; padding: 22px; max-width: 360px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 20px 50px -15px rgba(0, 0, 0, .5); }
.s3d-card h3 { font-family: var(--display); font-size: 28px; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.s3d-card p { margin: 0; font-size: 15px; }
.s3d-k { font-size: 12px !important; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.s3d-best { font-weight: 700; }
.s3d-go { margin-top: 6px; border: 0; border-radius: 999px; padding: 13px 18px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 800; font-size: 16px; }
.s3d-hap { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
.champ { background: var(--dark); color: var(--dark-on); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 6px; }
.champ .k { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.champ .v { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 7vw, 60px); line-height: 1; letter-spacing: -.03em; }

/* search */
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 999px; padding: 0 20px; transition: box-shadow .2s; }
.search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: inherit; font-size: 16px; padding: 14px 0; outline: none; }
.search input::placeholder { color: var(--muted); }

/* sections */
section { scroll-margin-top: 110px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 900px) { section { scroll-margin-top: 72px; } }
.sh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 36px; }
.sh h2 { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5.5vw, 52px); line-height: 1; letter-spacing: -.025em; }
.note { color: var(--muted); font-size: 14px; max-width: 72ch; }

/* standings */
/* wide content scrolls sideways; shadows on the edges show there is more to swipe to */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 24px; background-color: var(--surface);
  background-image: linear-gradient(to right, var(--surface) 40%, transparent), linear-gradient(to left, var(--surface) 40%, transparent),
    radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, .2), transparent), radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, .2), transparent);
  background-position: left center, right center, left center, right center; background-size: 48px 100%, 48px 100%, 16px 100%, 16px 100%;
  background-repeat: no-repeat; background-attachment: local, local, scroll, scroll; }
.swipe { display: none; font-size: 12px; color: var(--muted); margin-top: -6px; }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 12px; text-align: right; white-space: nowrap; }
th { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
td { border-bottom: 1px solid var(--line); }
tbody tr { transition: background .2s; }
tbody tr:hover { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
td.rank { font-family: var(--display); font-weight: 700; font-size: 20px; width: 2.4rem; }
td.tm { font-weight: 700; }
td.tm .em { margin-right: 8px; }
td.strong { font-weight: 700; }
tr.q td.rank { color: var(--accent); }
tr.cut td { border-bottom: 2px dashed var(--muted); }
.qpill { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }

/* schedule */
/* each 20-minute slot is one tinted panel holding its Court 1 and Court 2 games; panels alternate blue and sand */
.slot { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 110px; background: var(--slot-a); border-radius: 28px; padding: 14px; }
.slot { box-shadow: inset 0 0 0 2px var(--slot-a-line); }
.slot.alt { background: var(--slot-b); box-shadow: inset 0 0 0 2px var(--slot-b-line); }
.slot.now { box-shadow: inset 0 0 0 3px var(--accent); }
.slot .match { background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
@media (min-width: 768px) { .slot { padding: 18px; } }
@media (min-width: 900px) { .slot { scroll-margin-top: 72px; } }
.slot-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 2px 4px 0; }
.slot-h .time { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.slot-h .stage { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slot.now .time { color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 820px) { .pair.two { grid-template-columns: 1fr 1fr; } }
.join { border: 1.5px dashed var(--line); border-radius: 18px; padding: 12px 18px; font-weight: 600; text-align: center; }
.match { background: var(--surface); border-radius: 24px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
@media (hover: hover) { .match:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -16px rgba(0, 0, 0, .22); } }
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 12px 16px; font-size: 13px; font-weight: 600; }
.mhead .gno { color: var(--muted); }
.chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.chip.c1 { background: var(--c1-soft); color: var(--c1); }
.chip.c2 { background: var(--c2-soft); color: var(--c2); }
.chip.c0 { background: var(--surface-2); color: var(--muted); }
.mhead .stagename { font-weight: 700; }
.mhead .done { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--win); }
.mbody { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; flex: 1; }
.tb { display: flex; flex-direction: column; padding: 14px 16px; min-width: 0; background: hsl(var(--h) var(--tint-s) var(--tint-l)); }
.tb.r { text-align: right; align-items: flex-end; }
.tb.tbd { background: transparent; justify-content: center; color: var(--muted); font-weight: 600; }
.tb .em { font-size: 22px; line-height: 1.2; }
.p { overflow-wrap: anywhere; width: fit-content; max-width: 100%; }
.p.lead { font-weight: 700; font-size: 16px; }
.p.hit { background: var(--hit); border-radius: 4px; padding-inline: 4px; }
.tb.lost { opacity: .55; }
.wtag { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--win); padding-top: 2px; }
.mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 12px; }
.vs { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--muted); }
.score b { font-weight: 700; color: var(--ink); }
.score i { font-style: normal; font-size: 22px; }
.inputs { display: flex; align-items: center; gap: 6px; }
.inputs input { width: 3.3rem; text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 2px; -moz-appearance: textfield; appearance: textfield; }
.inputs input::-webkit-outer-spin-button, .inputs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.inputs input:focus { border-color: var(--accent); }
.inputs input[disabled] { opacity: .45; }
.inputs span { color: var(--muted); font-weight: 700; }
.mfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.mfoot .st { flex: 1 1 12rem; min-width: 0; color: var(--muted); }
.mfoot .st.pend { color: var(--warn); font-weight: 700; }
.mfoot .st.bad { color: var(--err); font-weight: 600; }
.mfoot .st.good { color: var(--win); font-weight: 600; }
.mfoot button { background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px; font-weight: 600; }
.mfoot button:hover { border-color: var(--ink); }

/* bracket */
.bracket { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 820px) { .bracket { grid-template-columns: 1fr 1fr; align-items: center; } }
.bcol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bnode { background: var(--surface); border-radius: 22px; overflow: hidden; }
.bmeta { display: flex; justify-content: space-between; gap: 8px; padding: 12px 16px 4px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brow { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.brow + .brow { border-top: 1px solid var(--line); }
.brow .bt { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.brow .bt.tbd { color: var(--muted); font-weight: 500; }
.brow .em { margin-right: 8px; }
.brow .bs { font-family: var(--display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.brow.w .bt, .brow.w .bs { font-weight: 800; }
.brow.l { opacity: .5; }
.bnode.final { background: var(--dark); color: var(--dark-on); }
.bnode.final .bmeta { color: var(--gold); }
.bnode.final .brow + .brow { border-color: rgba(255, 255, 255, .14); }
.bnode.final .bt.tbd { color: rgba(255, 255, 255, .6); }
.bnode.final .brow .bs { font-size: 28px; }

/* teams */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.team { border-radius: 24px; padding: 18px; min-width: 0; display: flex; flex-direction: column; background: hsl(var(--h) var(--tint-s) var(--tint-l)); transition: transform .35s var(--ease); }
@media (hover: hover) { .team:hover { transform: translateY(-3px); } }
.team .em { font-size: 28px; line-height: 1.2; }
.team .tname { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; letter-spacing: -.025em; margin: 4px 0 6px; }
.team .rec { margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* gate */
.gatehead { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4.5vw, 40px); letter-spacing: -.02em; padding-top: 12px; }
.gate { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.choice { background: var(--surface); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.choice h2 { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -.035em; }
.choice p { color: var(--muted); }
.choice .go { margin-top: 10px; align-self: flex-start; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 12px 24px; transition: transform .25s var(--ease); }
.choice .go:hover { transform: translateY(-2px); }
.access { font-size: 14px; font-weight: 600; }
.access.ok { color: var(--win); }
.access.no { color: var(--err); }
.pwform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.pwform .go { margin-top: 0; }
.field { flex: 1 1 9rem; min-width: 0; font: inherit; font-size: 16px; padding: 11px 18px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); }

/* admin */
.banner { background: var(--warn-soft); border-radius: 20px; padding: 16px 18px; }
.banner b { color: var(--warn); }
.danger { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--surface); border-radius: 20px; padding: 16px 18px; }
.danger p { flex: 1 1 16rem; min-width: 0; color: var(--muted); }
.btn { font-weight: 700; font-size: 15px; border-radius: 999px; padding: 10px 20px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.btn.warn { border-color: var(--err); color: var(--err); }
.btn.warn.solid { background: var(--err); color: #fff; }
.danger.reset { background: var(--warn-soft); box-shadow: inset 0 0 0 1.5px var(--err); }
.danger.reset p, .danger.reset .field { flex-basis: 100%; }
.danger.reset p { color: var(--ink); }
.danger.reset p b { color: var(--err); }
.danger.reset p.access { color: var(--err); }
.btn[disabled] { opacity: .45; cursor: default; }
.savebar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: 1136px; margin-inline: auto; background: var(--dark); color: var(--dark-on); border-radius: 24px; padding: 14px 18px; box-shadow: 0 24px 60px -16px rgba(0, 0, 0, .5); }
.savebar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.savebar .msg { flex: 1 1 14rem; min-width: 0; font-weight: 700; }
.savebar .msg small { display: block; font-weight: 400; color: rgba(255, 255, 255, .7); font-size: 13px; }
.savebar .btn { border-color: rgba(255, 255, 255, .35); color: var(--dark-on); }
.savebar .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
#none { text-align: center; color: var(--muted); padding: 20px 0; }

/* popups: scorecard and add-to-home-screen. They live outside #root so live score refreshes never close them. */
dialog.pop { width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); margin: auto; padding: 0; border: 0; border-radius: 28px; background: var(--bg); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55); overscroll-behavior: contain; }
dialog.pop::backdrop { background: rgba(0, 0, 0, .55); }
.pop-in { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.pop-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pop-h h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -.02em; }
.xbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: var(--surface); font-size: 22px; line-height: 1; }
.pop select { font: inherit; font-size: 16px; width: 100%; padding: 11px 16px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); }
.clock { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border-radius: 20px; padding: 12px 16px; }
.clock .t { flex: 1 1 auto; font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.clock .t small { display: block; font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.clock.on .t { color: var(--live); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; border-radius: 22px; padding: 12px; background: hsl(var(--h, 210) var(--tint-s) var(--tint-l)); }
.side .nm { font-weight: 700; text-align: center; overflow-wrap: anywhere; min-height: 1.5em; }
.side .plus { border: 0; border-radius: 18px; background: var(--card); padding: 14px 4px; font-family: var(--display); font-weight: 700; font-size: clamp(64px, 20vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.side .plus:active { transform: scale(.97); }
.side .plus small { display: block; font-family: var(--body); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }
.side .minus { border: 1.5px solid var(--line); border-radius: 999px; background: transparent; padding: 6px; font-weight: 700; touch-action: manipulation; }
.pop .row { display: flex; flex-wrap: wrap; gap: 8px; }
.pop .row .btn { flex: 1 1 auto; }
.pop .msg2 { font-size: 14px; color: var(--muted); }
.pop .msg2.good { color: var(--win); font-weight: 600; }
.pop ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

/* page tabs, previous-tournament strip, jump links */
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.subtabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.subtabs-in { max-width: 1200px; margin-inline: auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
@media (min-width: 768px) { .subtabs-in { padding-inline: 32px; } }
.subtabs .k { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.subtabs a { font-weight: 700; font-size: 14px; text-decoration: none; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
.subtabs a[aria-current="page"] { color: var(--bg); background: var(--ink); }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.ctas a { text-decoration: none; }
button.pill { font-family: inherit; cursor: pointer; }

/* CAT 2.0: three games a round, resting team, pools side by side */
@media (min-width: 820px) { .pair.three { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1180px) { .pair.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.slot-h .bye { font-size: 13px; font-weight: 600; color: var(--muted); }
.pools { display: grid; gap: 16px; min-width: 0; }
@media (min-width: 1100px) { .pools.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pooltbl { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ph { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -.02em; }
.gtag { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--err); background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }

/* blacked-out game: absent team or a team that left early */
.match.out, .slot .match.out { background: repeating-linear-gradient(135deg, #0d0d0d 0 12px, #1c1c1c 12px 24px); color: #fff; }
.match.out .tb { background: transparent; opacity: .5; }
.match.out .p { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.match.out .gno { color: rgba(255, 255, 255, .65); }
.match.out .mfoot { border-color: rgba(255, 255, 255, .15); }
.match.out .mfoot .st.bad { color: #ff9c94; }
.match.out .mfoot button { border-color: rgba(255, 255, 255, .35); }
.xo { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #fff; border: 1.5px solid rgba(255, 255, 255, .5); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.mhead .done.x { color: rgba(255, 255, 255, .8); }
.mfoot button.blk { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* admins */
.admins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.admin { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: hsl(var(--h) var(--tint-s) var(--tint-l)); }
.admin .av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; background: var(--ink); color: var(--bg); }
.admin .an { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.02em; }
.admin .ar { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
select.field { appearance: none; -webkit-appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

/* smaller page header for gallery and rules */
.phead .hero-in { padding: 40px 16px 36px; }
@media (min-width: 768px) { .phead .hero-in { padding: 72px 32px 56px; } }
.phead h1 { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 9vw, 104px); line-height: .95; letter-spacing: -.04em; overflow-wrap: anywhere; }

/* gallery */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 700; }
.chipbtn span { font-size: 12px; opacity: .7; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
@media (min-width: 768px) { .gal { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; } }
.gi { position: relative; display: block; border: 0; padding: 0; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--surface); }
.gi img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
@media (hover: hover) { .gi:hover img { transform: scale(1.05); } }
.gi.vid::after { content: "▶"; position: absolute; inset: 0; margin: auto; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; padding-left: 4px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 20px; }
.empty { background: var(--surface); border-radius: 24px; padding: 48px 24px; text-align: center; color: var(--muted); }
dialog.pop.lb { width: min(1100px, calc(100% - 24px)); }
.lb .pop-h h2 { font-size: 20px; }
.lbm img, .lbm video { display: block; width: 100%; max-height: 72vh; object-fit: contain; border-radius: 18px; background: #000; }

/* rules: each card has a looping picture; tapping it pauses */
.rules, .tlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.rule { background: var(--surface); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.rfig { display: block; width: 100%; border: 0; padding: 0; background: var(--sky); cursor: pointer; }
.rfig svg { display: block; width: 100%; height: auto; }
.rule.paused .sv * { animation-play-state: paused !important; }
.rt, .tcard { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
.rn { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--accent); }
.rule h3, .tcard h3 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; letter-spacing: -.02em; }
.tcard { background: var(--surface); border-radius: 24px; padding: 20px 22px; }
.tcard .ic { font-size: 30px; line-height: 1; }
.banner a { color: inherit; font-weight: 700; text-underline-offset: 3px; }
.sv text { font-family: var(--body); font-weight: 700; font-size: 10px; fill: var(--ink); }
.sv .sand { fill: var(--sand); } .sv .sky { fill: var(--sky); }
.sv .cl { fill: none; stroke: #fff; stroke-width: 2.5; }
.sv .fz { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .5; }
.sv .net { stroke: var(--ink); stroke-width: 3; }
.sv .mesh { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.sv .div { stroke: var(--line); stroke-width: 2; }
.sv .pa { fill: var(--c1); } .sv .pb { fill: var(--live); }
.sv .bl { fill: #ffd23f; stroke: #1d4ed8; stroke-width: 1.5; }
.sv .ok { fill: var(--win); } .sv .no { fill: var(--live); }
.sv .big { font-family: var(--display); font-size: 26px; }
.sv .num { font-family: var(--display); font-size: 16px; fill: var(--accent); }
.sv .emo { font-size: 44px; }
.sv .mk { font-size: 24px; }
.sv .shl { fill: var(--ink); opacity: .75; }
.sv .arw { stroke-width: 4; stroke-linecap: round; } .sv .ok-s { stroke: var(--win); } .sv .no-s { stroke: var(--live); }
.sv .rbg { fill: none; stroke: var(--line); stroke-width: 6; }
.sv .ring { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 176; }
.sv .wline { fill: #fff; }
.sv .rip { fill: none; stroke: #fff; stroke-width: 2; opacity: 0; }
.sv .face { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
.sv .hand { stroke: var(--live); stroke-width: 3; stroke-linecap: round; transform-origin: 120px 64px; }
.sv .fb { transform-box: fill-box; transform-origin: center; }
.a-pulse { animation: r-pulse 2.4s ease-in-out infinite; }
@keyframes r-pulse { 50% { opacity: .15; } }
.a-rally { animation: r-rally 4s ease-in-out infinite; }
@keyframes r-rally { 0%, 100% { transform: translate(75px, 50px); } 25% { transform: translate(170px, 88px); } 50% { transform: translate(80px, 92px); } 75% { transform: translate(165px, 48px); } }
.a-shuf1 { animation: r-shuf1 3s ease-in-out infinite; } .a-shuf2 { animation: r-shuf2 3.4s ease-in-out infinite; }
@keyframes r-shuf1 { 50% { transform: translate(12px, 6px); } }
@keyframes r-shuf2 { 50% { transform: translate(-10px, -6px); } }
.a-arc { animation: r-arc 2.6s linear infinite; }
@keyframes r-arc { 0% { transform: translate(40px, 80px); } 20% { transform: translate(80px, 40px); } 40% { transform: translate(120px, 28px); } 60% { transform: translate(158px, 48px); } 78%, 100% { transform: translate(185px, 100px); } }

<script>
(function () {
  'use strict';

  /* ---------- tournaments ----------

  function pg(id, c, a, b) { return { id: id, c: c, a: a, b: b }; }

  var CAT1 = {

    },
    stats: function (done) { return [['7', 'Teams'], ['2', 'Courts'], ['20', 'Minutes per game'], [done + '/25', 'Games played']]; },
    qText: 'The top 4 after the pool games play the semi-finals.',

    koNote: 'After the 21 pool games, 1st plays 4th and 2nd plays 3rd. The winners play the final, the losers play for 3rd place.',
    check: function (a, b, g) { return g.ko && a === b ? 'A knockout game needs a winner. The scores cannot be level.' : ''; }
  };
  CAT1.pools = [{ name: '', q: 4, teams: CAT1.teams.map(function (t) { return t.id; }) }];

  function duo(id, e, hue, a, b, sat) { return { id: id, e: e, h: hue, s: sat, p: [a, b], n: a + ' & ' + b }; }
  var POOL_A = [duo('yh', '🦅', 10, 'Yatharth', 'Harish'), duo('dm', '🐬', 200, 'David', 'Mitch'), duo('cn', '🌵', 120, 'Cynthia', 'Neil'),
    duo('lh', '🦁', 38, 'Léo', 'Hamza'), duo('ec', '🍉', 350, 'Edoardo', 'Crystal'), duo('sp', '🐙', 275, 'Shane', 'Peter'), duo('tc', '🌸', 320, 'Thitikorn', 'Charlene')];
  var POOL_B = [duo('rs', '🚀', 225, 'Rob', 'Stan'), duo('as', '⚡', 50, 'Ash', 'Sat', 78), duo('rk', '⚽', 90, 'Rossi', 'Khai'),
    duo('uk', '🐯', 25, 'Udhaya', 'Karthi'), duo('sf', '🐼', 155, 'Supi', 'Fai'), duo('tj', '🎯', 0, 'Anand', 'Josh'), duo('ks', '🌊', 190, 'Khather', 'Syed')];
  function ids(l) { return l.map(function (t) { return t.id; }); }
  /* Sunday 25 October: 2 nets, no time limit. Games go on in this order: when a court is free, the next game
     goes on. Rounds 1-6 are Pool A only, Pool B joins from round 7 (about 5:30 PM). Each row is one round:
     Court 1 teams, then Court 2 teams. Searched so no team plays three games in a row. */
  var SCHED = [
    ['cn', 'sp', 'dm', 'ec'],
    ['yh', 'lh', 'dm', 'tc'],
    ['ec', 'sp', 'yh', 'cn'],
    ['dm', 'sp', 'lh', 'tc'],
    ['yh', 'dm', 'cn', 'ec'],
    ['sp', 'tc', 'lh', 'ec'],
    ['as', 'rk', 'tj', 'ks'],

  function rounds(sched) {
    var id = 1, aIds = ids(POOL_A);
    return sched.map(function (row, k) {
      var g = [], pools = {};
      [[row[0], row[1]], [row[2], row[3]]].forEach(function (p, c) {

        var pool = aIds.indexOf(p[0]) > -1 ? 'A' : 'B', x = pg(id++, c + 1, p[0], p[1]);

      });
      return { t: 'Round ' + (k + 1), stage: 'Pool ' + Object.keys(pools).sort().join(' and '), g: g,
        join: k === B_FROM ? 'Pool B starts here, at 5:30 PM at the earliest.' : null };
    });
  }
  var CAT2 = {
    key: 'cat2', ver: '2.0', path: 'scores-cat2.json', archived: true,
    /* When the venue is confirmed: { name: 'Kallang Beach Courts', map: 'https://maps.app.goo.gl/...' } */
    venue: null,
    sub: 'Beach volleyball, 2v2. Sunday 25 October 2026, from 4:00 PM on 2 courts. 14 teams in two pools, then the semi-finals and the final. Every game is first to 15, no deuce.',
    ball: { src: 'assets/mikasa.png', w: 480, h: 480 },
    teams: POOL_A.concat(POOL_B),
    slots: rounds(SCHED).concat([
      { t: 'Semi-finals', stage: 'Knockouts', grp: 'KO', g: [
        { id: 43, c: 1, ko: 'Semi-final 1', wait: 'Teams are set once every Pool A and Pool B game is done.' },

      { t: 'Final', stage: 'Knockouts', grp: 'KO', g: [{ id: 45, c: 1, ko: 'Final', wait: 'Teams are set once both semi-finals have a score.' }] }]),
    pools: [{ name: 'Pool A', q: 2, teams: ids(POOL_A) }, { name: 'Pool B', q: 2, teams: ids(POOL_B) }],
    final: 45, bracket: [[43, 44], [45]],
    ko: function (S, mk, K) {

  });

  /* The tournament on screen. Everything below reads these. */
  var TR, TEAMS, T, SLOTS, GAMES, POOL, STATE;
  function use(tr) { TR = tr; TEAMS = tr.teams; T = tr.T; SLOTS = tr.slots; GAMES = tr.games; POOL = tr.pool; STATE = tr.state; }

  /* Team colour: hue, plus an optional stronger saturation for pale hues like yellow. */
  function tint(t) { return '--h:' + t.h + (t.s ? ';--tint-s:' + t.s + '%' : ''); }

  function isOut(scores, id) { var r = scores[id]; return !!(r && r.x); }
  function goneSet(state) { var o = {}; (state.gone || []).forEach(function (id) { o[id] = true; }); return o; }

  function standings(state, p) {
    var scores = state.scores, gone = goneSet(state), rows = {}, played = 0, settled = 0;
    p.teams.forEach(function (id) { rows[id] = { id: id, i: T[id].i, p: 0, w: 0, d: 0, l: 0, pf: 0, pa: 0, gone: !!gone[id] }; });

        }).join('') + '<circle cx="44" cy="95" r="4" class="bl"/>' + txt(60, 124, 'back right serves') + txt(80, 20, 'rotate clockwise ↻')) },

        txt(98, 98, '✗', 'mk no a-pop1 fb') + txt(165, 30, '+1', 'big ok a-plus fb') + txt(120, 128, 'wrong server: point to the other team')) }
  ];
  function ruleCards(list) {

  function renderRules() {
    root.appendChild(subtabs('Rules', RULE_SUB));
    var v = page === 'rules-3v3'

  /* ---------- tournament rules: CAT 2.0 ---------- */
  var TOUR_RULES = [

    ['🏐', 'Scoring', 'Every game is one set, first to 15 points, no deuce, with no time limit. At 14–14 the next rally wins the game 15–14. The admins may set some games to 21 instead, with the same no-deuce rule. Every rally wins a point, whoever served.'],
    ['↔️', 'Changing ends', 'Teams change ends every 5 points, counting both scores together (at 5, 10, 15, 20 and so on), as in the deciding set of an FIVB match.'],
    ['📊', 'Pool ranking', 'Teams are ranked by wins, then point difference, then points scored. If exactly two teams are still level, the game between them decides.'],
    ['🏆', 'Semi-finals and final', 'The top 2 of each pool go through. Semi-final 1: Pool A winner against Pool B 2nd. Semi-final 2: Pool B winner against Pool A 2nd. The two winners play the final. These games are also first to 15, no deuce.'],
    ['⬛', 'Absent or leaving early', 'If a team does not turn up for a game, or leaves before its games are done, the admins black out those games. A blacked-out game does not count for either team. A team that withdraws drops to the bottom of its pool and cannot reach the semi-finals. A team that misses a semi-final or the final loses it 15–0.'],

    ['📘', 'Everything else', 'Anything these rules do not cover follows the FIVB beach volleyball rules on the Rules page.']

  function renderTourRules() {
    root.appendChild(subtabs('CAT 2.0', CAT2_SUB));
    root.appendChild(pageHead('Casual SG Advanced Tournament', 'Tournament rules', 'How CAT 2.0 is played: two pools, semi-finals and the final, every game first to 15 with no deuce.'));
    root.appendChild(h('div', { class: 'wrap' },
      h('div', { class: 'tlist' }, TOUR_RULES.map(function (r) {

      })),
      h('div', { class: 'ctas' }, h('a', { class: 'pill solid', href: '#cat2', text: 'Back to CAT 2.0' }), h('a', { class: 'pill', href: '#rules', text: '2v2 beach rules' })),
      footer()));
  }

  /* ---------- popups ---------- */
  function popup(id, label) {
    var d = h('dialog', { class: 'pop', id: id, 'aria-label': label });
    /* a tap on the dark backdrop closes it */
    d.addEventListener('click', function (ev) { if (ev.target === d) d.close(); });
    document.body.appendChild(d);
    return d;
  }
  function popHead(d, title) {
    return h('div', { class: 'pop-h' }, h('h2', { text: title }),
      h('button', { class: 'xbtn', type: 'button', 'aria-label': 'Close', text: '×', onclick: function () { d.close(); } }));
  }
  /* destructive buttons need a second tap within 3 seconds */
  function twoTap(label, fn) {
    var armed = null;
    var b = h('button', { class: 'btn', type: 'button', text: label, onclick: function () {
      if (armed) { clearTimeout(armed); armed = null; b.textContent = label; fn(); return; }
      b.textContent = 'Tap again to confirm';
      armed = setTimeout(function () { armed = null; b.textContent = label; }, 3000);
    } });
    return b;
  }

  /* ---------- scorecard: a point counter and match clock for anyone at the courts (CAT 2.0) ----------
     Kept on this device only. The clock stores when it started, not a tick count, so it stays
     right when the phone sleeps, the tab is closed or the page reloads. */
  var sc = { g: '', a: 0, b: 0, start: null, acc: 0 };
  try {
    var scSaved = JSON.parse(lget('cat2.sc') || 'null');
    if (scSaved && isInt(scSaved.a) && isInt(scSaved.b)) sc = {
      g: GAMES.some(function (g) { return String(g.id) === String(scSaved.g); }) ? String(scSaved.g) : '',
      a: scSaved.a, b: scSaved.b,
      start: typeof scSaved.start === 'number' && scSaved.start <= Date.now() ? scSaved.start : null,
      acc: typeof scSaved.acc === 'number' && scSaved.acc >= 0 ? scSaved.acc : 0 };
  } catch (e) {}
  function scKeep() { lset('cat2.sc', JSON.stringify(sc)); }
  function elapsed() { return Math.max(0, sc.acc + (sc.start ? Date.now() - sc.start : 0)); }
  function clockText(ms) {
    var s = Math.floor(ms / 1000), hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
    return (hh ? hh + ':' + (mm < 10 ? '0' : '') : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  }
  var scDlg = null, scEl = {}, scTick = null, wake = null;
  function lockScreen() {
    /* keep the phone screen on while the clock runs and the scorecard is open */
    if (wake || !sc.start || !scDlg || !scDlg.open || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { if (wake === w) wake = null; }); }, function () {});
  }
  function unlockScreen() { if (wake) { wake.release().catch(function () {}); wake = null; } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) lockScreen(); });
  function scTeams() {
    var g = sc.g && GAMES.filter(function (x) { return String(x.id) === sc.g; })[0], v = g && VIEW[g.id];
    return { g: g, a: v && v.a, b: v && v.b, la: v ? (v.la || 'Team A') : 'Team A', lb: v ? (v.lb || 'Team B') : 'Team B' };
  }
  function teamName(id, fallback) { return id ? T[id].e + ' ' + tn(T[id]) : fallback; }
  function scPaint() {
    if (!scDlg) return;
    var t = scTeams();
    scClock();
    scEl.clock.classList.toggle('on', !!sc.start);
    scEl.go.textContent = sc.start ? 'Pause' : elapsed() ? 'Resume' : 'Start';
    scEl.go.className = 'btn' + (sc.start ? '' : ' primary');
    ['a', 'b'].forEach(function (k) {
      var id = t[k], name = teamName(id, t['l' + k]);
      scEl['side' + k].style.cssText = id ? tint(T[id]) : '';
      scEl['nm' + k].textContent = name;
      scEl['n' + k].firstChild.nodeValue = String(sc[k]);
      scEl['plus' + k].setAttribute('aria-label', 'Add a point for ' + name + '. Now ' + sc[k] + '.');
      scEl['minus' + k].setAttribute('aria-label', 'Take a point off ' + name);
      scEl['minus' + k].disabled = !sc[k];
    });
    var canUse = admin() && t.g && t.a && t.b;
    scEl.use.hidden = !canUse;
    if (canUse) scEl.use.textContent = 'Put ' + sc.a + '–' + sc.b + ' into Game ' + t.g.id;
  }
  function scClock() {
    var txt = clockText(elapsed()), n = scEl.t.firstChild;
    if (n.nodeValue !== txt) n.nodeValue = txt;
  }
  function scPoint(k, d) {
    var n = sc[k] + d;
    if (n < 0 || n > 99) return;
    /* no cap: some games are played to 21 */
    sc[k] = n; scEl.msg.className = 'msg2'; scEl.msg.textContent = ''; scKeep(); scPaint();
  }
  function scBuild() {
    if (!scDlg) {
      scDlg = popup('scorecard', 'Scorecard');
      scDlg.addEventListener('close', function () { clearInterval(scTick); scTick = null; unlockScreen(); scFull(false); });
    }
    scDlg.textContent = '';
    var sel = h('select', { 'aria-label': 'Which game', onchange: function (ev) { sc.g = ev.target.value; scKeep(); scPaint(); } },
      h('option', { value: '', text: 'Any match (no game picked)' }),
      GAMES.map(function (g) {
        var v = VIEW[g.id];
        return h('option', { value: String(g.id), selected: String(g.id) === sc.g,
          text: 'Game ' + g.id + (g.ko ? ', ' + g.ko : '') + ': ' + teamName(v.a, v.la) + ' vs ' + teamName(v.b, v.lb) });
      }));

      scEl['n' + k] = h('span', null, '0', h('small', { text: '+1 point' }));
      scEl['plus' + k] = h('button', { class: 'plus', type: 'button', onclick: function () { scPoint(k, 1); } }, scEl['n' + k]);

    }
    scEl.t = h('p', { class: 't', role: 'timer', 'aria-live': 'off' }, '0:00', h('small', { text: 'Match time' }));
    scEl.go = h('button', { class: 'btn primary', type: 'button', onclick: function () {
      if (sc.start) { sc.acc = elapsed(); sc.start = null; unlockScreen(); } else { sc.start = Date.now(); lockScreen(); }
      scKeep(); scPaint();
    } });
    scEl.clock = h('div', { class: 'clock' }, scEl.t, scEl.go,
      twoTap('Reset clock', function () { sc.start = null; sc.acc = 0; unlockScreen(); scKeep(); scPaint(); }));
    scEl.msg = h('p', { class: 'msg2', role: 'status' });
    scEl.use = h('button', { class: 'btn primary', type: 'button', hidden: true, onclick: function () {
      var t = scTeams();
      if (!admin() || !t.g || !t.a || !t.b) return;
      mark(t.g.id, { a: String(sc.a), b: String(sc.b) });
      keepDraft();
      render();
      scEl.msg.className = 'msg2 good';
      scEl.msg.textContent = 'Added to Game ' + t.g.id + '. Close this and tap Save scores to publish it.';
    } });
    var head = popHead(scDlg, 'Scorecard');
    scEl.rot = h('button', { class: 'btn rot', type: 'button', onclick: function () {

    scDlg.appendChild(h('div', { class: 'pop-in' }, head, sel, scEl.clock,
      h('div', { class: 'sides' }, scSide('a'), scSide('b')),
      h('div', { class: 'row' }, twoTap('Reset score to 0–0', function () { sc.a = 0; sc.b = 0; scEl.msg.textContent = ''; scKeep(); scPaint(); }), scEl.use),
      scEl.msg,
      h('p', { class: 'msg2', text: 'Only on this phone: it does not change the scores on the website.' })));
    scPaint();
  }
  /* Landscape: turning the phone sideways switches the layout by itself. The toggle forces it:
     where the browser allows, it goes full screen and locks to landscape; otherwise (iPhone) the
     scorecard is drawn turned sideways, so the phone just needs to be held sideways. */
  var scLand = lget('cat.land') === '1';
  var mqWide = matchMedia('(orientation: landscape) and (max-height: 540px)'), mqTall = matchMedia('(orientation: portrait)');
  function scLayout() {
    if (!scDlg) return;
    scDlg.classList.toggle('lay', scLand || mqWide.matches);
    scDlg.classList.toggle('turn', scLand && mqTall.matches);
    scEl.rot.textContent = scLand ? 'Portrait' : mqWide.matches ? 'Lock landscape' : 'Landscape';
    scEl.rot.setAttribute('aria-pressed', scLand ? 'true' : 'false');
  }
  function scFull(on) {
    try {
      if (on && scDlg.open && scDlg.requestFullscreen && !document.fullscreenElement) {
        scDlg.requestFullscreen().then(function () { return screen.orientation && screen.orientation.lock('landscape'); }).then(scLayout, scLayout);
      } else if (!on && document.fullscreenElement) {

  [mqWide, mqTall].forEach(function (m) { if (m.addEventListener) m.addEventListener('change', scLayout); });
  function openSc() {
    scBuild();
    if (!scDlg.open) scDlg.showModal();
    scLayout();
    if (scLand) scFull(true);
    clearInterval(scTick);
    scTick = setInterval(scClock, 250);

  }

  /* ---------- add to home screen ---------- */
  var installEv = null, appDlg = null;
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); installEv = ev; });
  window.addEventListener('appinstalled', function () { installEv = null; if (appDlg && appDlg.open) appDlg.close(); if (!typing() && !saving) render(); });
  function installed() {
    try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; }
  }
  function openApp() {
    if (installEv) {
      var ev = installEv; installEv = null;
      ev.prompt();
      return;
    }
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var steps = ios
      ? ['Tap the Share button (the square with an arrow) in Safari’s toolbar.', 'Scroll down and tap Add to Home Screen.', 'Tap Add. Casual SG now opens from your home screen like an app.']
      : /Android/.test(ua)

    if (!appDlg) appDlg = popup('getapp', 'Get the app');
    appDlg.textContent = '';
    var copied = h('p', { class: 'msg2', role: 'status' });
    appDlg.appendChild(h('div', { class: 'pop-in' }, popHead(appDlg, 'Get the app'),
      h('p', { text: 'Add Casual SG to your home screen to open live scores and the scorecard in one tap.' }),
      h('ol', null, steps.map(function (s) { return h('li', { text: s }); })),
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', text: 'Copy the link', onclick: function () {
        var url = location.origin + location.pathname;
        function ok() { copied.className = 'msg2 good'; copied.textContent = 'Link copied.'; }
        function no() { copied.className = 'msg2'; copied.textContent = url; }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, no); else no();
      } })), copied));
    appDlg.showModal();
  }

  /* move the Live marker when the clock enters a new slot */
  var lastLive = -2;
  setInterval(function () { if ((mode === 'viewer' || mode === 'admin') && tourPage() && liveIdx() !== lastLive && !typing() && !saving) render(); }, 30000);

  function applySearch() {
    var v = query.trim().toLowerCase(), any = false;
    root.querySelectorAll('.match, .team').forEach(function (el) {
      var show = !v || el.getAttribute('data-s').indexOf(v) > -1;
      el.hidden = !show;
      if (show && el.classList.contains('match')) any = true;
      el.querySelectorAll('.p').forEach(function (p) { p.classList.toggle('hit', !!v && p.textContent.toLowerCase().indexOf(v) > -1); });
    });
    root.querySelectorAll('.slot').forEach(function (s) { s.hidden = !!v && !s.querySelector('.match:not([hidden])'); });
    root.querySelectorAll('.join').forEach(function (s) { s.hidden = !!v; });
    var t = document.getElementById('teams'); if (t) t.hidden = !!v && !t.querySelector('.team:not([hidden])');
    var n = document.getElementById('none'); if (n) n.hidden = any || !v;
  }

  function updateBar() {
    if (bar) { bar.remove(); bar = null; }
    document.body.classList.remove('has-bar');
    if (!admin()) return;
    var c = counts();
    if (!c.n && !c.bad && !saving && !saveMsg) return;
    var main = saving ? 'Saving…'
      : c.n ? c.n + (c.n === 1 ? ' unsaved change' : ' unsaved changes')
      : c.bad ? 'Nothing to save yet' : 'Not saved';
    var sub = saveMsg || (c.bad ? c.bad + (c.bad === 1 ? ' game needs fixing first. It is marked in red.' : ' games need fixing first. They are marked in red.') : 'Saving updates the website for everyone within about a minute.');
    bar = h('div', { class: 'savebar', role: 'status' }, h('div', { class: 'savebar-in' },
      h('p', { class: 'msg' }, main, h('small', { text: sub })),
      h('button', { class: 'btn', type: 'button', id: 'discard', text: 'Discard', disabled: saving || !(c.n || c.bad),
        onclick: function () { draft = {}; saveMsg = ''; keepDraft(); render(); } }),
      h('button', { class: 'btn primary', type: 'button', id: 'save', text: saveBlock() || 'Save scores', disabled: saving || !!saveBlock() || !c.n || c.bad > 0,
        onclick: function () { save(false); } })));
    document.body.appendChild(bar);
    document.body.classList.add('has-bar');
  }

  /* Show saved scores on first paint instead of a flash of an empty scoresheet. On a slow connection, show the page anyway after 4 seconds. */
  var jumped = false;
  function first() {
    if (!root.firstChild) render();
    if (jumped) return;
    jumped = true;
    var el = location.hash.length > 1 && !hashPage() && document.getElementById(location.hash.slice(1));
    if (el) el.scrollIntoView();
  }
  setTimeout(first, 4000);
  Promise.all([poll(CAT2), poll(CAT1)]).then(first, first);
})();
