<title>CAT 1.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: entry gate (Viewer / Admin), then one scrolling page: navy scoreboard header, up-next strip, standings table, schedule by 20-minute slot with Court 1 and Court 2 side by side, teams. Admin adds score inputs and a fixed save bar. */
:root {
  --bg: #edf2f8;
  --surface: #ffffff;
  --ink: #10293f;
  --muted: #556a7e;
  --line: #d2dde9;
  --head: #0f3a66;
  --head-on: #ffffff;
  --head-soft: #b9d2ee;
  --gold: #f4bd16;
  --gold-on: #3d2e00;
  --c1: #1c66c4;
  --c1-soft: #e0ecfb;
  --c2: #177a4d;
  --c2-soft: #dcf1e6;
  --win: #156f45;
  --warn: #9a4a06;
  --warn-soft: #fdeed8;
  --err: #b3261e;
  --hit: #ffe08a;
  --tint-s: 85%;
  --tint-l: 93%;
  --display: "Saira Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1622;
    --surface: #132333;
    --ink: #e7eff7;
    --muted: #9db0c3;
    --line: #26394c;
    --head: #16395f;
    --head-on: #ffffff;
    --head-soft: #a9c6e6;
    --gold: #f6c93f;
    --gold-on: #2e2300;
    --c1: #74aef5;
    --c1-soft: #173252;
    --c2: #62cc97;
    --c2-soft: #143a2a;
    --win: #62cc97;
    --warn: #f2a964;
    --warn-soft: #3a2a14;
    --err: #ff8a80;
    --hit: #6b5410;
    --tint-s: 38%;
    --tint-l: 21%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1622;
  --surface: #132333;
  --ink: #e7eff7;
  --muted: #9db0c3;
  --line: #26394c;
  --head: #16395f;
  --head-on: #ffffff;
  --head-soft: #a9c6e6;
  --gold: #f6c93f;
  --gold-on: #2e2300;
  --c1: #74aef5;
  --c1-soft: #173252;
  --c2: #62cc97;
  --c2-soft: #143a2a;
  --win: #62cc97;
  --warn: #f2a964;
  --warn-soft: #3a2a14;
  --err: #ff8a80;
  --hit: #6b5410;
  --tint-s: 38%;
  --tint-l: 21%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 16px 56px; }
body.has-bar { padding-bottom: 150px; }
.wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

/* header */
.head { background: var(--head); color: var(--head-on); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.head .eyebrow { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--head-soft); }
.head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 15vw, 92px); line-height: .88; letter-spacing: .01em; text-transform: uppercase; }
.head h1 b { color: var(--gold); font-weight: 800; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts span { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--head-soft); border-radius: 999px; padding: 1px 10px; }
.headrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 4px; }
.mode { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: var(--gold-on); border-radius: 999px; padding: 1px 12px; }
.linkbtn { background: transparent; border: 0; padding: 2px 0; color: var(--head-on); text-decoration: underline; text-underline-offset: 3px; }
.stamp { color: var(--head-soft); font-size: 13px; margin-left: auto; }

/* gate */
.gate { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.choice { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
button.choice:hover { border-color: var(--c1); }
.choice h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.choice p { color: var(--muted); }
.choice .go { margin-top: 6px; align-self: flex-start; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; background: var(--head); color: var(--head-on); border: 0; border-radius: 999px; padding: 6px 18px; }
.choice .go[disabled] { opacity: .45; cursor: default; }
.access { font-size: 14px; font-weight: 600; }
.access.ok { color: var(--win); }
.access.no { color: var(--warn); }
.pwform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.pwform .go { margin-top: 0; }
.field { flex: 1 1 9rem; min-width: 0; font: inherit; font-size: 16px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); }
.gatehead { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; }

/* notes */
.note { color: var(--muted); font-size: 14px; max-width: 72ch; }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.banner b { color: var(--warn); }
.next { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.next .k { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.next .v { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; }
.next .prog { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.next a { color: var(--c1); }
.champ { background: var(--gold); color: var(--gold-on); border-radius: 14px; padding: 14px 16px; }
.champ .k { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
.champ .v { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; text-transform: uppercase; }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 1px solid var(--line); margin-inline: -16px; padding: 10px 16px; }
.bar-in { max-width: 1040px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-width: 0; }
.search:focus-within { outline: 2px solid var(--c1); outline-offset: 1px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: inherit; font-size: 16px; padding: 9px 0; outline: none; }
.search input::placeholder { color: var(--muted); }
.nav { display: flex; gap: 6px; }
.nav a { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
.nav a:hover { border-color: var(--ink); }

/* sections */
section { scroll-margin-top: 7.5rem; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.sh { display: flex; align-items: baseline; gap: 12px; }
.sh h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.sh .rule { flex: 1; height: 2px; background: var(--line); align-self: center; }

/* standings */
.tscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; }
th { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
td { border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
td.rank { font-family: var(--display); font-weight: 800; font-size: 20px; width: 2.2rem; }
td.tm { font-weight: 700; }
td.tm .em { margin-right: 6px; }
td.strong { font-weight: 700; }
tr.q td.rank { color: var(--win); }
tr.cut td { border-bottom: 2px dashed var(--muted); }
.qpill { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--win); border: 1px solid var(--win); border-radius: 999px; padding: 0 6px; margin-left: 8px; vertical-align: 1px; }

/* schedule */
.slot { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 7.5rem; }
.slot-h { display: flex; align-items: baseline; gap: 10px; }
.slot-h .time { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.slot-h .stage { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slot.now .time { color: var(--c1); }
.pair { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 820px) { .pair.two { grid-template-columns: 1fr 1fr; } }
.join { background: var(--c1-soft); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.mhead .gno { color: var(--muted); }
.chip { border-radius: 999px; padding: 0 10px; }
.chip.c1 { background: var(--c1-soft); color: var(--c1); }
.chip.c2 { background: var(--c2-soft); color: var(--c2); }
.chip.c0 { border: 1px solid var(--line); color: var(--muted); }
.mhead .stagename { color: var(--ink); }
.mhead .done { margin-left: auto; color: var(--win); }
.mbody { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; flex: 1; }
.tb { display: flex; flex-direction: column; padding: 10px 12px; min-width: 0; background: hsl(var(--h) var(--tint-s) var(--tint-l)); }
.tb.r { text-align: right; align-items: flex-end; }
.tb.tbd { background: transparent; justify-content: center; color: var(--muted); font-weight: 600; }
.tb .em { font-size: 20px; line-height: 1.2; }
.p { overflow-wrap: anywhere; width: fit-content; max-width: 100%; }
.p.lead { font-weight: 700; font-size: 16px; }
.p.hit { background: var(--hit); border-radius: 4px; padding-inline: 4px; }
.tb.lost { opacity: .62; }
.wtag { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--win); }
.mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 10px; }
.vs { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
.score b { font-weight: 800; color: var(--ink); }
.score i { font-style: normal; font-size: 20px; }
.inputs { display: flex; align-items: center; gap: 6px; }
.inputs input { width: 3.3rem; text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 6px 2px; -moz-appearance: textfield; appearance: textfield; }
.inputs input::-webkit-outer-spin-button, .inputs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.inputs input:focus { border-color: var(--c1); }
.inputs input[disabled] { opacity: .45; }
.inputs span { color: var(--muted); font-weight: 700; }
.mfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.mfoot .st { flex: 1 1 12rem; min-width: 0; color: var(--muted); }
.mfoot .st.pend { color: var(--warn); font-weight: 700; }
.mfoot .st.bad { color: var(--err); font-weight: 600; }
.mfoot .st.good { color: var(--win); font-weight: 600; }
.mfoot button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
.mfoot button:hover { border-color: var(--ink); }

/* teams */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
.team { border-radius: 14px; padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; background: hsl(var(--h) var(--tint-s) var(--tint-l)); }
.team .em { font-size: 26px; line-height: 1.2; }
.team .tname { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase; margin-bottom: 4px; }
.team .rec { margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* admin */
.danger { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }
.danger p { flex: 1 1 16rem; min-width: 0; color: var(--muted); }
.btn { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 6px 18px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-on); }
.btn.warn { border-color: var(--err); color: var(--err); }
.btn[disabled] { opacity: .5; cursor: default; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--head); color: var(--head-on); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.savebar-in { max-width: 1040px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.savebar .msg { flex: 1 1 14rem; min-width: 0; font-weight: 600; }
.savebar .msg small { display: block; font-weight: 400; color: var(--head-soft); font-size: 13px; }
.savebar .btn { background: transparent; border-color: var(--head-soft); color: var(--head-on); }
.savebar .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-on); }
#none { text-align: center; color: var(--muted); padding: 20px 0; }
@media (max-width: 420px) {
  .tb { padding: 10px 9px; }
  .score { font-size: 30px; }
  .inputs input { width: 2.9rem; font-size: 24px; }
  th, td { padding: 8px 7px; }
}

<script id="app">
(function () {
  'use strict';

  /* ---------- fixed tournament data (from the two posters) ---------- */
  var TEAMS = [
    { id: 'ash',    e: '🔥', h: 6,   p: ['Ash', 'Yatha', 'Anas'] },
    { id: 'sat',    e: '⚡', h: 210, p: ['Sat', 'Sky', 'Alex'] },
    { id: 'maddy',  e: '👑', h: 50,  p: ['Maddy', 'Harish', 'Nicole'] },
    { id: 'eugene', e: '🦖', h: 125, p: ['Eugene', 'Rossi', 'Din'] },
    { id: 'barath', e: '🦍', h: 268, p: ['Barath', 'Shane', 'Raochelle'] },
    { id: 'mika',   e: '🐼', h: 26,  p: ['Mika', 'Supi', 'TK'] },
    { id: 'david',  e: '🦈', h: 186, p: ['David', 'Stan', 'Gladys'] }
  ];
  var T = {};
  TEAMS.forEach(function (t, i) { t.i = i; T[t.id] = t; });

  function pg(id, c, a, b) { return { id: id, c: c, a: a, b: b }; }
  var SLOTS = [
    { t: '6:00 – 6:20', stage: 'Pool', g: [pg(1, 1, 'ash', 'sat'), pg(2, 2, 'maddy', 'eugene')] },
    { t: '6:20 – 6:40', stage: 'Pool', g: [pg(3, 1, 'ash', 'maddy'), pg(4, 2, 'sat', 'eugene')] },
    { t: '6:40 – 7:00', stage: 'Pool', g: [pg(5, 1, 'ash', 'eugene'), pg(6, 2, 'sat', 'maddy')] },
    { t: '7:00 – 7:20', stage: 'Pool', join: true, g: [pg(7, 1, 'barath', 'mika'), pg(8, 2, 'david', 'ash')] },
    { t: '7:20 – 7:40', stage: 'Pool', g: [pg(9, 1, 'barath', 'sat'), pg(10, 2, 'mika', 'maddy')] },
    { t: '7:40 – 8:00', stage: 'Pool', g: [pg(11, 1, 'david', 'eugene'), pg(12, 2, 'barath', 'ash')] },
    { t: '8:00 – 8:20', stage: 'Pool', g: [pg(13, 1, 'mika', 'sat'), pg(14, 2, 'david', 'maddy')] },
    { t: '8:20 – 8:40', stage: 'Pool', g: [pg(15, 1, 'barath', 'eugene'), pg(16, 2, 'mika', 'ash')] },
    { t: '8:40 – 9:00', stage: 'Pool', g: [pg(17, 1, 'david', 'sat'), pg(18, 2, 'barath', 'maddy')] },
    { t: '9:00 – 9:20', stage: 'Pool', g: [pg(19, 1, 'mika', 'eugene'), pg(20, 2, 'david', 'barath')] },
    { t: '9:20 – 9:40', stage: 'Pool', g: [pg(21, 0, 'david', 'mika')] },
    { t: '9:40 – 10:00', stage: 'Semi-finals', g: [{ id: 22, c: 1, ko: 'Semi-final 1' }, { id: 23, c: 2, ko: 'Semi-final 2' }] },
    { t: '10:00 – 10:20', stage: '3rd place', g: [{ id: 24, c: 0, ko: '3rd place' }] },
    { t: '10:20 – 10:40', stage: 'Final', g: [{ id: 25, c: 0, ko: 'Final' }] }
  ];
  var GAMES = [];
  SLOTS.forEach(function (s) { s.g.forEach(function (g) { GAMES.push(g); }); });
  var POOL = GAMES.filter(function (g) { return !g.ko; });

  /* ---------- saved state: embedded in the page itself ---------- */
  var STATE = { v: 1, scores: {}, updated: null };
  try {
    var parsed = JSON.parse(document.getElementById('state').textContent);
    if (parsed && parsed.scores && typeof parsed.scores === 'object') STATE = parsed;
  } catch (e) {}

  function isInt(n) { return typeof n === 'number' && n >= 0 && n <= 99 && Math.floor(n) === n; }
  function rec(scores, id) { var r = scores[id]; return r && isInt(r.a) && isInt(r.b) ? r : null; }

  function standings(scores) {
    var rows = {}, played = 0;
    TEAMS.forEach(function (t) { rows[t.id] = { id: t.id, i: t.i, p: 0, w: 0, d: 0, l: 0, pf: 0, pa: 0 }; });
    POOL.forEach(function (g) {
      var r = rec(scores, g.id);
      if (!r) return;
      played++;
      var A = rows[g.a], B = rows[g.b];
      A.p++; B.p++; A.pf += r.a; A.pa += r.b; B.pf += r.b; B.pa += r.a;
      if (r.a > r.b) { A.w++; B.l++; } else if (r.a < r.b) { B.w++; A.l++; } else { A.d++; B.d++; }
    });
    function h2h(x, y) {
      for (var k = 0; k < POOL.length; k++) {
        var g = POOL[k], r = rec(scores, g.id);
        if (!r) continue;
        if (g.a === x.id && g.b === y.id) return r.b - r.a;
        if (g.a === y.id && g.b === x.id) return r.a - r.b;
      }
      return 0;
    }
    var list = TEAMS.map(function (t) { return rows[t.id]; });
    list.sort(function (x, y) {
      return (y.w * 2 + y.d) - (x.w * 2 + x.d) || (y.pf - y.pa) - (x.pf - x.pa) || y.pf - x.pf || h2h(x, y) || x.i - y.i;
    });
    return { list: list, rows: rows, played: played, done: played === POOL.length };
  }

  /* Knockout teams are derived, never stored on their own. A knockout score is
     only valid for the two teams it was saved against, so a later correction
     that changes the seeding or a semi-final winner retires it automatically. */
  function resolve(scores) {
    var st = standings(scores), K = {};
    var seed = st.done ? st.list.map(function (r) { return r.id; }) : null;
    function mk(id, a, b, la, lb) {
      var g = { a: a || null, b: b || null, la: la, lb: lb, res: null, stale: false, win: null, lose: null };
      var r = rec(scores, id);
      if (r) {

        confirmReset
          ? [h('p', { text: 'Clear every saved score for everyone? This cannot be undone.' }),
             h('button', { class: 'btn warn', type: 'button', text: 'Yes, clear all scores', onclick: function () { save(true); } }),
             h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: function () { confirmReset = false; render(); } })]
          : [h('p', { text: 'Start again from an empty scoresheet, for example after a test run.' }),
             h('button', { class: 'btn warn', type: 'button', text: 'Clear all scores', disabled: !hasAny, onclick: function () { confirmReset = true; render(); } })]));
    }
    root.appendChild(wrap);
    applySearch();
    updateBar();
  }

  function applySearch() {
    var v = query.trim().toLowerCase(), any = false;
    root.querySelectorAll('.match, .team').forEach(function (el) {
      var show = !v || el.getAttribute('data-s').indexOf(v) > -1;
      el.hidden = !show;
      if (show && el.classList.contains('match')) any = true;
      el.querySelectorAll('.p').forEach(function (p) { p.classList.toggle('hit', !!v && p.textContent.toLowerCase().indexOf(v) > -1); });
    });
    root.querySelectorAll('.slot').forEach(function (s) { s.hidden = !!v && !s.querySelector('.match:not([hidden])'); });
    root.querySelectorAll('.join').forEach(function (s) { s.hidden = !!v; });
    var t = document.getElementById('teams'); if (t) t.hidden = !!v && !t.querySelector('.team:not([hidden])');
    var n = document.getElementById('none'); if (n) n.hidden = any || !v;
  }

  function updateBar() {
    if (bar) { bar.remove(); bar = null; }
    document.body.classList.remove('has-bar');
    if (mode !== 'admin') return;
    var c = counts();
    if (!c.n && !c.bad && !saving && !saveMsg) return;
    var main = saving ? 'Saving…'
      : c.n ? c.n + (c.n === 1 ? ' unsaved change' : ' unsaved changes')
      : c.bad ? 'Nothing to save yet' : 'Not saved';
    var sub = saveMsg || (c.bad ? c.bad + (c.bad === 1 ? ' game needs fixing first. It is marked in red.' : ' games need fixing first. They are marked in red.') : 'Saving updates the page for everyone who has the link.');
    bar = h('div', { class: 'savebar', role: 'status' }, h('div', { class: 'savebar-in' },
      h('p', { class: 'msg' }, main, h('small', { text: sub })),
      h('button', { class: 'btn', type: 'button', id: 'discard', text: 'Discard', disabled: saving || !(c.n || c.bad),
        onclick: function () { draft = {}; saveMsg = ''; sset('cat.draft', '{}'); render(); } }),
      h('button', { class: 'btn primary', type: 'button', id: 'save', text: saveBlock() || 'Save scores', disabled: saving || !!saveBlock() || !c.n || c.bad > 0,
        onclick: function () { save(false); } })));
    document.body.appendChild(bar);
    document.body.classList.add('has-bar');
  }

  render();
})();
</script>
